<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night dim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; color: {{fg}}; font-family: 'Manrope', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 28px 24px 32px; overflow: hidden">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<p style="margin: 0; font-size: 92px; line-height: 100px; font-weight: 700; letter-spacing: -2px">9:49</p>
<p style="margin: 0; font-size: 18px; line-height: 26px; font-weight: 600">Rain on the tent · 38 min left</p>
</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 12px">
<a href="F-NowPlaying.dc.html" style="flex: 1 1 0; height: 72px; border-radius: 20px; border: 1px solid {{line}}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Wake screen</a>
<button type="button" onClick="{{swap}}" aria-pressed="{{black}}" style="flex: 1 1 0; height: 72px; border-radius: 20px; border: 1px solid {{line}}; background: transparent; color: {{fg}}; font-size: 17px; font-weight: 700">{{swapLabel}}</button>
</div>
<p style="margin: 0; text-align: center; font-size: 14px; line-height: 20px">No animation. The app lowers its own brightness on this screen.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { black: false };
  }
  renderVals() {
    var self = this;
    var black = this.state.black;
    return {
      black: black,
      bg: black ? '#000000' : '#120A06',
      fg: black ? '#B8703C' : '#D08A52',
      line: black ? '#5A3A22' : '#6B4426',
      swapLabel: black ? 'Warm dark' : 'True black',
      swap: function () { self.setState({ black: !self.state.black }); }
    };
  }
}
</script>
</body>
</html>
