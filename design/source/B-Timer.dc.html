<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sleep timer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #12100E; color: #F2E9DC; font-family: 'Manrope', sans-serif; display: flex; flex-direction: column; gap: 22px; padding: 18px 20px 24px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 8px">
<a href="B-Tonight.dc.html" aria-label="Back to Tonight" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -6px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 800">Sleep timer</h1>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 4px">
<p style="margin: 0; font-size: 58px; line-height: 66px; font-weight: 800; letter-spacing: -1px">{{headline}}</p>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #C9BBA6">{{ends}}</p>
</div>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #C9BBA6">Play for</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{lengths}}" as="o" hint-placeholder-count="6">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 72px; border-radius: 16px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 17px; font-weight: 800">{{o.label}}</button>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #C9BBA6">Fade out over</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{fades}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 64px; border-radius: 16px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 15px; font-weight: 800">{{o.label}}</button>
</sc-for>
</div>
</section>

<p style="margin: 0; font-size: 14px; line-height: 21px; color: #C9BBA6">The timer lives here and on Tonight, for every mix and session. It keeps running if the app closes.</p>

<a href="B-Tonight.dc.html" style="margin-top: auto; height: 72px; border-radius: 36px; background: #E8A860; color: #2A1C0C; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">Done</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mins: 45, fade: 10 };
  }
  option(key, value, label) {
    var self = this;
    var on = this.state[key] === value;
    return {
      label: label, on: on,
      bg: on ? '#E8A860' : '#1C1916',
      fg: on ? '#2A1C0C' : '#F2E9DC',
      bd: on ? '#E8A860' : '#332C25',
      pick: function () { var p = {}; p[key] = value; self.setState(p); }
    };
  }
  renderVals() {
    var self = this;
    var m = this.state.mins;
    var clock = function (total) {
      var h = Math.floor(total / 60) % 24;
      var min = total % 60;
      var suffix = h >= 12 ? 'PM' : 'AM';
      var h12 = h % 12 === 0 ? 12 : h % 12;
      return h12 + ':' + (min < 10 ? '0' : '') + min + ' ' + suffix;
    };
    var headline = m === 0 ? 'All night' : (m >= 60 ? (m / 60) + ' hr' : m + ' min');
    var ends = m === 0 ? 'Plays until you stop it' : 'Silent by about ' + clock(21 * 60 + 42 + m);
    var lengths = [[15, '15 min'], [30, '30 min'], [45, '45 min'], [60, '1 hr'], [90, '1.5 hr'], [0, 'All night']]
      .map(function (o) { return self.option('mins', o[0], o[1]); });
    var fades = [[2, '2 min'], [5, '5 min'], [10, '10 min'], [20, '20 min']]
      .map(function (o) { return self.option('fade', o[0], o[1]); });
    return { headline: headline, ends: ends, lengths: lengths, fades: fades };
  }
}
</script>
</body>
</html>
