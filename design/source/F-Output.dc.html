<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Output picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
h2{margin:0;font-size:14px;font-weight:700;color:#C9BBA6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #12100E; color: #F2E9DC; font-family: 'Manrope', sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 24px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px">
<a href="B-Tonight.dc.html" aria-label="Back to Tonight" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -6px"><svg class="ic" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 800">Play sound on</h1>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2>{{g.title}}</h2>
<sc-for list="{{g.items}}" as="d" hint-placeholder-count="2">
<button type="button" onClick="{{d.pick}}" disabled="{{d.off}}" aria-pressed="{{d.on}}" style="min-height: 64px; box-sizing: border-box; padding: 10px 14px; border-radius: 16px; border: 1px solid {{d.bd}}; background: {{d.bg}}; color: {{d.fg}}; display: flex; align-items: center; gap: 12px; text-align: left">
<svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto"><path d="{{d.icon}}"></path></svg>
<span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px">
<b style="font-size: 16px; font-weight: 700">{{d.name}}</b>
<span style="font-size: 13px; line-height: 18px; color: {{d.sub}}">{{d.note}}</span>
</span>
<sc-if value="{{d.on}}" hint-placeholder-val="{{ false }}"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto; color: #E8A860"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
</button>
</sc-for>
</section>
</sc-for>

<div style="margin-top: auto; background: #1C1916; border: 1px solid #332C25; border-radius: 16px; padding: 12px 14px">
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #C9BBA6">{{note}}</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var PHONE = 'M9 2h6a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2ZM11 18h2';
var SPEAKER = 'M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM12 18a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM12 7h.01';
var TV = 'M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1ZM8 21h8';
var BT = 'm7 7 10 10-5 4V3l5 4L7 17';
var GROUPS = [
  { title: 'This phone', items: [{ id: 'phone', name: 'Phone speaker', note: 'Live mixing. Default.', icon: PHONE }] },
  { title: 'Bluetooth and Cast', items: [{ id: 'bt', name: 'Nothing connected', note: 'Paired and nearby devices show here', icon: BT, off: true }] },
  { title: 'From Home Assistant', items: [
    { id: 'sonos', name: 'Bedroom', note: 'Sonos, ready', icon: SPEAKER },
    { id: 'lg', name: 'LG webOS TV', note: 'Bedroom, unavailable right now', icon: TV, off: true },
    { id: 'lr', name: 'Living Room TV', note: 'Living Room, unavailable right now', icon: TV, off: true }
  ] }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'phone' };
  }
  renderVals() {
    var self = this;
    var sel = this.state.sel;
    var groups = GROUPS.map(function (g) {
      return {
        title: g.title,
        items: g.items.map(function (d) {
          var on = sel === d.id;
          return Object.assign({}, d, {
            on: on,
            off: !!d.off,
            bg: on ? '#26211C' : '#1C1916',
            bd: on ? '#E8A860' : '#332C25',
            fg: d.off ? '#A89A86' : '#F2E9DC',
            sub: d.off ? '#A89A86' : '#C9BBA6',
            pick: function () { if (!d.off) { self.setState({ sel: d.id }); } }
          });
        })
      };
    });
    var note = sel === 'sonos'
      ? 'Sonos plays a prepared copy of your mix. Changing sounds takes a moment to rebuild it. If it can\'t start, sound moves to the phone.'
      : 'Live mixing on this phone. Volume and layer changes apply right away.';
    return { groups: groups, note: note };
  }
}
</script>
</body>
</html>
