<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Grid mixer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input[type=range]{width:100%;height:44px;margin:0;accent-color:#A9B8FF;background:transparent}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #0B1026; color: #E6EAFA; font-family: 'Nunito Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 22px 20px 10px; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 26px; line-height: 34px; font-weight: 800">Mixer</h1>
<span style="font-size: 14px; font-weight: 700; color: #B7C0E8">{{count}} playing</span>
</div>
<div style="flex: 1 1 auto; overflow-y: auto; padding: 0 20px 110px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 12px; align-content: start">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.on}}" aria-label="{{t.name}}" style="width: 100%; height: 84px; border-radius: 22px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center">
<svg class="ic" width="38" height="38" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg>
</button>
<span style="font-size: 13px; font-weight: 700; text-align: center">{{t.name}}</span>
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
<input type="range" min="0" max="100" value="{{t.vol}}" onChange="{{t.setVol}}" aria-label="{{t.name}} volume">
</sc-if>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 36px; background: #1D2750; border: 1px solid #3A4784">
<a href="A-Timer.dc.html" aria-label="Sleep timer" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM12 9v4l3 2M9 2h6"></path></svg></a>
<a href="A-Tonight.dc.html" aria-label="Play" style="width: 64px; height: 64px; border-radius: 32px; background: #A9B8FF; color: #0B1026; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8L7 4Z" fill="currentColor"></path></svg></a>
<a href="F-Output.dc.html" aria-label="Output" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2ZM11 18h2"></path></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var SOUNDS = [
  { id: 'heavy', name: 'Heavy rain', d: 'M7 15a4 4 0 0 1 .5-8A5 5 0 0 1 17 8a3.5 3.5 0 0 1 0 7H7ZM9 18v2M13 18v2M17 18v2' },
  { id: 'light', name: 'Light rain', d: 'M7 15a4 4 0 0 1 .5-8A5 5 0 0 1 17 8a3.5 3.5 0 0 1 0 7H7ZM12 18v2' },
  { id: 'thunder', name: 'Thunder', d: 'M13 3 6 14h5l-1 7 7-11h-5l1-7Z' },
  { id: 'tent', name: 'Rain on tent', d: 'M12 4 3 20h18L12 4ZM12 4v16M9 20l3-6 3 6' },
  { id: 'ocean', name: 'Ocean', d: 'M3 9c3-3 6-3 9 0s6 3 9 0M3 15c3-3 6-3 9 0s6 3 9 0' },
  { id: 'wind', name: 'Wind', d: 'M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3' },
  { id: 'forest', name: 'Forest', d: 'M12 3 6 12h3l-4 6h14l-4-6h3L12 3ZM12 18v3' },
  { id: 'fire', name: 'Fire', d: 'M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-2 1-4 3-5 0 2 1 3 2 3 1-3-1-6 1-9Z' },
  { id: 'drip', name: 'Drip', d: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z' },
  { id: 'white', name: 'White noise', d: 'M3 12h3l2-7 3 14 3-11 2 7 2-3h3' },
  { id: 'pink', name: 'Pink noise', d: 'M3 12h4l2-4 3 8 3-6 2 2h4' },
  { id: 'brown', name: 'Brown noise', d: 'M3 13c2-3 4-3 6 0s4 3 6 0 4-3 6 0' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: { heavy: 70, thunder: 30, brown: 45 } };
  }
  renderVals() {
    var self = this;
    var active = this.state.active;
    var tiles = SOUNDS.map(function (s) {
      var on = active[s.id] !== undefined;
      return Object.assign({}, s, {
        on: on,
        vol: on ? active[s.id] : 0,
        bg: on ? '#A9B8FF' : '#151C3D',
        fg: on ? '#0B1026' : '#E6EAFA',
        bd: on ? '#A9B8FF' : '#2A3463',
        toggle: function () {
          var next = Object.assign({}, self.state.active);
          if (on) { delete next[s.id]; } else { next[s.id] = 50; }
          self.setState({ active: next });
        },
        setVol: function (e) {
          var next = Object.assign({}, self.state.active);
          next[s.id] = Number(e.target.value);
          self.setState({ active: next });
        }
      });
    });
    return { tiles: tiles, count: Object.keys(active).length };
  }
}
</script>
</body>
</html>
