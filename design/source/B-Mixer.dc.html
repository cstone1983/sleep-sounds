<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mixer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input[type=range]{width:100%;height:44px;margin:0;accent-color:#E8A860;background:transparent}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pill a{min-width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:28px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #12100E; color: #F2E9DC; font-family: 'Manrope', sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 18px 16px 0; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="B-Tonight.dc.html" aria-label="Back to Tonight" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -4px"><svg class="ic" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 800">Rain on the tent</h1>
<a href="F-Mixes.dc.html" style="min-width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end; font-size: 15px; font-weight: 700; color: #E8A860">Save</a>
</div>

<section aria-label="Playing now" style="background: #1C1916; border: 1px solid #332C25; border-radius: 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; max-height: 300px; overflow-y: auto">
<p style="margin: 0 0 2px; font-size: 13px; font-weight: 700; color: #C9BBA6">Playing now · {{count}}</p>
<sc-for list="{{tray}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 8px; min-height: 44px">
<svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="color: #E8A860; flex: 0 0 auto"><path d="{{s.d}}"></path></svg>
<span style="flex: 1 1 auto; font-size: 15px; font-weight: 700">{{s.name}}</span>
<button type="button" aria-pressed="{{s.driftOn}}" onClick="{{s.toggleDrift}}" style="height: 44px; min-width: 52px; padding: 0 4px; border: 0; background: none; font-size: 13px; font-weight: 700; color: {{s.driftColor}}">Drift</button>
<button type="button" aria-pressed="{{s.softOn}}" onClick="{{s.toggleSoft}}" style="height: 44px; min-width: 52px; padding: 0 4px; border: 0; background: none; font-size: 13px; font-weight: 700; color: {{s.softColor}}">Soften</button>
</div>
<input type="range" min="0" max="100" value="{{s.vol}}" onChange="{{s.setVol}}" aria-label="{{s.name}} volume">
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 8px 0; font-size: 14px; line-height: 20px; color: #C9BBA6">Tap a sound below to add it.</p>
</sc-if>
</section>

<div role="group" aria-label="Sound category" style="display: flex; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="flex: 1 1 0; height: 44px; border-radius: 22px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 700">{{c.name}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
<button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.on}}" style="height: 92px; border-radius: 16px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; line-height: 16px; font-weight: 700; padding: 6px">
<svg class="ic" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg>
{{t.name}}
</button>
</sc-for>
</div>

<div class="pill" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 36px; background: #26211C; border: 1px solid #453B31">
<a href="B-Timer.dc.html" aria-label="Sleep timer, 45 minutes"><svg class="ic" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM12 9v4l3 2M9 2h6"></path></svg></a>
<a href="F-NowPlaying.dc.html" aria-label="Start" style="background: #E8A860; color: #2A1C0C; min-width: 72px"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8L7 4Z" fill="currentColor"></path></svg></a>
<a href="F-Output.dc.html" aria-label="Output, phone speaker"><svg class="ic" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2ZM11 18h2"></path></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var RAIN = 'M7 15a4 4 0 0 1 .5-8A5 5 0 0 1 17 8a3.5 3.5 0 0 1 0 7H7ZM9 18v2M13 18v2M17 18v2';
var SOUNDS = [
  { id: 'heavy', name: 'Heavy rain', cat: 'Rain', d: RAIN },
  { id: 'light', name: 'Light rain', cat: 'Rain', d: 'M7 15a4 4 0 0 1 .5-8A5 5 0 0 1 17 8a3.5 3.5 0 0 1 0 7H7ZM12 18v2' },
  { id: 'thunder', name: 'Thunder', cat: 'Rain', d: 'M13 3 6 14h5l-1 7 7-11h-5l1-7Z' },
  { id: 'roof', name: 'Rain on roof', cat: 'Rain', d: 'M3 13 12 6l9 7M6 11v8h12v-8' },
  { id: 'tent', name: 'Rain on tent', cat: 'Rain', d: 'M12 4 3 20h18L12 4ZM12 4v16M9 20l3-6 3 6' },
  { id: 'drip', name: 'Drip', cat: 'Rain', d: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z' },
  { id: 'ocean', name: 'Ocean', cat: 'Nature', d: 'M3 9c3-3 6-3 9 0s6 3 9 0M3 15c3-3 6-3 9 0s6 3 9 0' },
  { id: 'creek', name: 'Creek', cat: 'Nature', d: 'M3 7c3-2 6-2 9 0s6 2 9 0M3 12c3-2 6-2 9 0s6 2 9 0M3 17c3-2 6-2 9 0s6 2 9 0' },
  { id: 'wind', name: 'Wind', cat: 'Nature', d: 'M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3' },
  { id: 'forest', name: 'Forest', cat: 'Nature', d: 'M12 3 6 12h3l-4 6h14l-4-6h3L12 3ZM12 18v3' },
  { id: 'fire', name: 'Fire', cat: 'Nature', d: 'M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-2 1-4 3-5 0 2 1 3 2 3 1-3-1-6 1-9Z' },
  { id: 'crickets', name: 'Crickets', cat: 'Nature', d: 'M12 6c3 0 4 3 4 6s-1 8-4 8-4-5-4-8 1-6 4-6ZM8 11l-4-2M16 11l4-2M8 15l-4 2M16 15l4 2M10 6 8 3M14 6l2-3' },
  { id: 'white', name: 'White noise', cat: 'Noise', d: 'M3 12h3l2-7 3 14 3-11 2 7 2-3h3' },
  { id: 'pink', name: 'Pink noise', cat: 'Noise', d: 'M3 12h4l2-4 3 8 3-6 2 2h4' },
  { id: 'brown', name: 'Brown noise', cat: 'Noise', d: 'M3 13c2-3 4-3 6 0s4 3 6 0 4-3 6 0' },
  { id: 'fan', name: 'Fan', cat: 'Noise', d: 'M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM12 10c-1-4 1-7 4-6 2 1 1 5-2 7M14 12c4-1 7 1 6 4-1 2-5 1-7-2M12 14c1 4-1 7-4 6-2-1-1-5 2-7M10 12c-4 1-7-1-6-4 1-2 5-1 7 2' },
  { id: 'train', name: 'Train', cat: 'Noise', d: 'M7 3h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM5 11h14M8 21l2-4M16 21l-2-4' },
  { id: 'hum', name: 'Low hum', cat: 'Noise', d: 'M3 12h3M9 8v8M13 5v14M17 8v8M21 12h-1' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: { heavy: 70, thunder: 30, brown: 45 }, drift: { thunder: true }, soft: {}, cat: 'Rain' };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var flip = function (key, id) {
      var next = Object.assign({}, self.state[key]);
      next[id] = !next[id];
      var patch = {};
      patch[key] = next;
      self.setState(patch);
    };
    var tray = SOUNDS.filter(function (s) { return st.active[s.id] !== undefined; }).map(function (s) {
      return Object.assign({}, s, {
        vol: st.active[s.id],
        driftOn: !!st.drift[s.id],
        softOn: !!st.soft[s.id],
        driftColor: st.drift[s.id] ? '#E8A860' : '#A89A86',
        softColor: st.soft[s.id] ? '#E8A860' : '#A89A86',
        toggleDrift: function () { flip('drift', s.id); },
        toggleSoft: function () { flip('soft', s.id); },
        setVol: function (e) {
          var next = Object.assign({}, self.state.active);
          next[s.id] = Number(e.target.value);
          self.setState({ active: next });
        }
      });
    });
    var tiles = SOUNDS.filter(function (s) { return s.cat === st.cat; }).map(function (s) {
      var on = st.active[s.id] !== undefined;
      return Object.assign({}, s, {
        on: on,
        bg: on ? '#E8A860' : '#1C1916',
        fg: on ? '#2A1C0C' : '#F2E9DC',
        bd: on ? '#E8A860' : '#332C25',
        toggle: function () {
          var next = Object.assign({}, self.state.active);
          if (on) { delete next[s.id]; } else { next[s.id] = 50; }
          self.setState({ active: next });
        }
      });
    });
    var cats = ['Rain', 'Nature', 'Noise'].map(function (name) {
      var on = st.cat === name;
      return {
        name: name, on: on,
        bg: on ? '#26211C' : 'transparent',
        fg: on ? '#F2E9DC' : '#C9BBA6',
        bd: on ? '#6B5B48' : '#332C25',
        pick: function () { self.setState({ cat: name }); }
      };
    });
    return { tray: tray, tiles: tiles, cats: cats, count: tray.length, empty: tray.length === 0 };
  }
}
</script>
</body>
</html>
