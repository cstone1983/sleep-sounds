<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:600}
.bar{flex:1 1 auto;height:8px;border-radius:4px;background:#332C25;overflow:hidden}
.bar i{display:block;height:8px;background:#E8A860}
.side{flex:1 1 0;height:72px;border-radius:18px;background:#1C1916;border:1px solid #332C25;color:#F2E9DC;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #12100E; color: #F2E9DC; font-family: 'Manrope', sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 18px 20px 24px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="B-Tonight.dc.html" aria-label="Back to Tonight" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -6px"><svg class="ic" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"></path></svg></a>
<a href="F-Output.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #E8A860"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2ZM11 18h2"></path></svg>Phone speaker</a>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 24px">
<p style="margin: 0; font-size: 16px; font-weight: 700; color: #C9BBA6">Rain on the tent</p>
<p style="margin: 0; font-size: 66px; line-height: 76px; font-weight: 800; letter-spacing: -1px">{{left}}</p>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #C9BBA6">{{status}}</p>
</div>

<div style="display: flex; align-items: center; justify-content: center; padding: 10px 0">
<button type="button" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 112px; height: 112px; border-radius: 56px; border: 0; background: #E8A860; color: #2A1C0C; display: flex; align-items: center; justify-content: center">
<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h4v16H7zM14 4h4v16h-4z" fill="currentColor"></path></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8L7 4Z" fill="currentColor"></path></svg></sc-if>
</button>
</div>

<div style="display: flex; gap: 10px">
<button type="button" class="side" onClick="{{addTime}}">Add 15 min</button>
<a class="side" href="F-NightDim.dc.html">Dim screen</a>
</div>

<a href="B-Mixer.dc.html" aria-label="Open the mixer" style="background: #1C1916; border: 1px solid #332C25; border-radius: 18px; padding: 8px 16px; display: flex; flex-direction: column">
<div class="row"><span style="flex: 0 0 104px">Heavy rain</span><div class="bar"><i style="width: 70%"></i></div></div>
<div class="row"><span style="flex: 0 0 104px">Thunder</span><div class="bar"><i style="width: 30%"></i></div></div>
<div class="row"><span style="flex: 0 0 104px">Brown noise</span><div class="bar"><i style="width: 45%"></i></div></div>
</a>

<a href="B-Tonight.dc.html" style="margin-top: auto; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #C9BBA6">Stop for tonight</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true, left: 38 };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var total = 21 * 60 + 49 + st.left;
    var h = Math.floor(total / 60) % 24;
    var m = total % 60;
    var ends = (h % 12 === 0 ? 12 : h % 12) + ':' + (m < 10 ? '0' : '') + m + (h >= 12 ? ' PM' : ' AM');
    return {
      playing: st.playing,
      paused: !st.playing,
      playLabel: st.playing ? 'Pause' : 'Play',
      left: st.left + ' min',
      status: st.playing ? 'Silent by about ' + ends : 'Paused. The timer waits for you.',
      toggle: function () { self.setState({ playing: !self.state.playing }); },
      addTime: function () { self.setState({ left: self.state.left + 15 }); }
    };
  }
}
</script>
</body>
</html>
